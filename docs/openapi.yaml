      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClientId"
        - name: from
          in: query
          schema:
            type: integer
            format: int64
          description: Unix start of the window (default 24h ago).
        - name: to
          in: query
          schema:
            type: integer
            format: int64
          description: Unix end of the window (default now).
        - name: bucket
          in: query
          schema:
            type: integer
          description: Bucket width in seconds. NOTE handler currently reads limit, not bucket.
        - name: limit
          in: query
          schema:
            type: integer
          description: Max buckets returned (default 500).
      responses:
        "200":
          description: Time-ordered traffic buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficHistoryResponse"
  /api/v1/traffic/stream:
    get:
      x-veil-role: viewer
      tags: [traffic]
      summary: Server-sent stream of live traffic snapshots
      description: Emits a JSON snapshot per client every ~5s as SSE data frames.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: text/event-stream of per-client snapshots.
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/events:
    get:
      x-veil-role: viewer
      tags: [traffic]
      summary: Unified Server-Sent Events stream (A10)
      description: |
        Streams all panel events as SSE. Event types:
          - traffic: periodic traffic snapshot (every 5s)
          - apply: apply job state changes
        Filter by event type via ?types=traffic,apply (comma-separated).
      security:
        - sessionCookie: []
      parameters:
        - name: types
          in: query
          schema:
            type: string
            description: Comma-separated event types to stream (traffic, apply). Default all.
      responses:
        "200":
          description: text/event-stream of panel events.
          content:
            text/event-stream:
              schema:
                type: string
  /s/{token}:
    get:
      x-veil-role: public
      tags: [subscription]
      summary: Public subscription endpoint (token is the capability)
      description: |
        Unauthenticated; the token itself grants read access to the client's
        subscription. Unknown, disabled, revoked, or expired tokens all return
        an identical 404 to avoid oracle attacks. Supports ?format=base64 (default)
        or raw; HTML user agents receive a landing page.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [base64, raw]
      responses:
        "200":
          description: Subscription body (base64 or raw newline-separated links); HTML landing for browsers.
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        "404":
          description: Token unknown, disabled, revoked, or expired.
    head:
      x-veil-role: public
      tags: [subscription]
      summary: HEAD variant of the public subscription endpoint (headers only)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [base64, raw]
      responses:
        "200":
          description: Headers only.
        "404":
          description: Token unknown, disabled, revoked, or expired.
components:
  securitySchemes:
    veilToken:
      type: apiKey
      in: header
      name: X-Veil-Token
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: veil_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional replay key for create, update, and destructive operations. Reuse with a different payload returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BackupName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^veil_backup_[0-9]{8}_[0-9]{6}\.tar\.gz\.enc$'
    RestoreJobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    ClientId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request body, query string, or path failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error: {code: invalid_request, message: invalid JSON, requestId: example-request-id}
    Unauthorized:
      description: Missing or invalid token/session.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Present on authenticated API challenges.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missing:
              value:
                error: {code: unauthorized, message: missing or invalid API token or session, requestId: example-request-id}
    Forbidden:
      description: Authenticated principal is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            csrf:
              value:
                error: {code: forbidden, message: invalid or missing CSRF token, requestId: example-request-id}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            not-found:
              value:
                error: {code: not_found, message: not found, requestId: example-request-id}
    ServiceUnavailable:
      description: Runtime dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Candidate configuration failed authoritative validation and was not mutated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationFailure"
          examples:
            busy-port:
              value:
                error:
                  code: validation_failed
                  message: configuration failed live validation
                issues:
                  - code: port_in_use
                    severity: error
                    field: port
                    inboundId: edge
                    message: TCP port 443 is already in use
                    remediation: Stop the conflicting service or choose another port.
                    source: live-host
    PrivilegedFailure:
      description: The allowlisted root helper rejected or could not complete the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrivilegedErrorEnvelope"
          examples:
            unavailable:
              value:
                error:
                  code: operation_failed
                  message: privileged helper is unavailable
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
    ErrorObject:
      type: object
      required: [code, message, requestId]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          description: Server-generated request identifier.
    PrivilegedErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        error:
          type: string
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    KeyRotationResponse:
      type: object
      required: [success, revokedSessions]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        revokedSessions:
          type: integer
          minimum: 0
    SetupStatusResponse:
      type: object
      required: [required, allowed, panelAccess]
      properties:
        required:
          type: boolean
        allowed:
          type: boolean
        panelAccess:
          type: string
          enum: [local, direct, caddy, ""]
    SetupCompleteRequest:
      type: object
      required: [username, password, backupAcknowledged]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[\p{L}\p{N}._-]+$'
        password:
          type: string
          format: password
          minLength: 12
        backupAcknowledged:
          type: boolean
          const: true
        locale:
          $ref: "#/components/schemas/Locale"
    SetupCompleteResponse:
      type: object
      required: [completed, username, role, locale]
      properties:
        completed:
          type: boolean
          const: true
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        locale:
          $ref: "#/components/schemas/Locale"
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
