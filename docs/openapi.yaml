            examples:
              candidate:
                value:
                  settings:
                    panelListen: 127.0.0.1:2096
                    panelAccess: local
                    mode: server
                  inbounds:
                    - name: edge
                      protocol: mieru
                      transport: tcp
                      port: 443
                      enabled: true
                      password: "[REDACTED]"
                  warp:
                    enabled: false
                    endpoint: engage.cloudflareclient.com:2408
      responses:
