                  type: array
                  items:
                    type: string
                days:
                  type: integer
                quotaBytes:
                  type: integer
                  format: int64
                  minimum: 0
                  # Values above Number.MAX_SAFE_INTEGER cannot be represented
                  # exactly by JSON consumers (the SPA); rejected end-to-end.
                  maximum: 9007199254740991
                inboundId:
