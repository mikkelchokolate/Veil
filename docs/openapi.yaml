components:
  securitySchemes:
    veilToken:
      type: apiKey
      in: header
      name: X-Veil-Token
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: veil_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BackupName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^veil_backup_[0-9]{8}_[0-9]{6}\.tar\.gz\.enc$'
    RestoreJobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  responses:
    BadRequest:
      description: Request body, query string, or path failed validation.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          examples:
            invalid:
              value: "invalid JSON\n"
    Unauthorized:
      description: Missing or invalid token/session.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Present on authenticated API challenges.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          examples:
            missing:
              value: "missing or invalid API token or session\n"
    Forbidden:
      description: Authenticated principal is not allowed to perform the operation.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          examples:
            csrf:
              value: "invalid or missing CSRF token\n"
    NotFound:
      description: Resource not found.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          examples:
            not-found:
              value: "404 page not found\n"
    ServiceUnavailable:
      description: Runtime dependency is unavailable.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
    ValidationFailed:
      description: Candidate configuration failed authoritative validation and was not mutated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationFailure"
          examples:
            busy-port:
              value:
                error:
                  code: validation_failed
                  message: configuration failed live validation
                issues:
                  - code: port_in_use
                    severity: error
                    field: port
                    inboundId: edge
                    message: TCP port 443 is already in use
                    remediation: Stop the conflicting service or choose another port.
                    source: live-host
    PrivilegedFailure:
      description: The allowlisted root helper rejected or could not complete the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrivilegedErrorEnvelope"
          examples:
            unavailable:
              value:
                error:
                  code: operation_failed
                  message: privileged helper is unavailable
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    ErrorText:
      type: string
      description: Plain text error emitted by `writeError`; usually a single message line ending in `\n`.
    ErrorObject:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    PrivilegedErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        error:
          type: string
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    KeyRotationResponse:
      type: object
      required: [success, revokedSessions]
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        revokedSessions:
          type: integer
          minimum: 0
    SetupStatusResponse:
      type: object
      required: [required, allowed, panelAccess]
      properties:
        required:
          type: boolean
        allowed:
          type: boolean
        panelAccess:
          type: string
          enum: [local, direct, caddy, ""]
    SetupCompleteRequest:
      type: object
      required: [username, password, backupAcknowledged]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[\p{L}\p{N}._-]+$'
        password:
          type: string
          format: password
          minLength: 12
        backupAcknowledged:
          type: boolean
          const: true
        locale:
          $ref: "#/components/schemas/Locale"
    SetupCompleteResponse:
      type: object
      required: [completed, username, role, locale]
      properties:
        completed:
          type: boolean
          const: true
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        locale:
          $ref: "#/components/schemas/Locale"
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
