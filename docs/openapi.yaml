          type: array
          items:
            $ref: "#/components/schemas/ConnectionListener"
    ProcessInfo:
      type: object
      required: [pid, name, cpuPercent, memoryMB, uptimeSeconds]
      properties:
        pid:
          type: integer
        name:
          type: string
        cpuPercent:
          type: number
        memoryMB:
          type: integer
        uptimeSeconds:
          type: integer
    ProcessesStats:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInfo"
    DirSizeInfo:
      type: object
      required: [path, sizeBytes, sizeHuman]
      properties:
        path:
          type: string
        sizeBytes:
          type: integer
        sizeHuman:
          type: string
    DiskStats:
      type: object
      required: [dirs]
      properties:
        dirs:
          type: array
          items:
            $ref: "#/components/schemas/DirSizeInfo"
    RuntimeObservation:
      type: object
      required: [system, tls, network, connections, processes, disk]
      properties:
        system:
          $ref: "#/components/schemas/SystemStats"
        tls:
          $ref: "#/components/schemas/TLSCertInfo"
        network:
          $ref: "#/components/schemas/NetworkStats"
        connections:
          $ref: "#/components/schemas/ConnectionsStats"
        processes:
          $ref: "#/components/schemas/ProcessesStats"
        disk:
          $ref: "#/components/schemas/DiskStats"
        errors:
          type: object
          additionalProperties:
            type: string
    LogResult:
      type: object
      required: [unit, output]
      properties:
        unit:
          type: string
        output:
          type: string
    DNSLookupRequest:
      type: object
      required: [hostname]
      additionalProperties: false
      properties:
        hostname:
          type: string
          examples: [example.com]
    DNSLookupResult:
      type: object
      required: [hostname, addresses]
      properties:
        hostname:
          type: string
        addresses:
          type: array
          items:
            type: string
        cname:
          type: string
        error:
          type: string
    PingRequest:
      type: object
      required: [host]
      additionalProperties: false
      properties:
        host:
          type: string
          examples: [1.1.1.1]
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
    PingResult:
      type: object
      required: [host, transmitted, received, lossPct]
      properties:
        host:
          type: string
        transmitted:
          type: integer
        received:
          type: integer
        lossPct:
          type: number
        minMs:
          type: number
        avgMs:
          type: number
        maxMs:
          type: number
        stddevMs:
          type: number
        error:
          type: string
    SpeedtestResult:
      type: object
      required: [pingMs, downloadMbps, uploadMbps]
      properties:
        server:
          type: string
        pingMs:
          type: number
        downloadMbps:
          type: number
        uploadMbps:
          type: number
        raw:
          type: string
    ClientCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        email:
          type: [string, "null"]
        enabled:
          type: boolean
        groupId:
          type: [string, "null"]
        quotaBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 9007199254740991
        quotaResetPolicy:
          type: string
          enum: [never, daily, weekly, monthly]
        quotaResetAt:
          type: [integer, "null"]
          format: int64
        expiresAt:
          type: [integer, "null"]
          format: int64
        deviceLimit:
          type: [integer, "null"]
          minimum: 0
        notes:
          type: string
        bindings:
          type: array
          description: >-
            Bind the client to inbounds atomically with creation. When
            credential is empty the server generates a high-entropy secret and
            returns its plaintext once in issuedCredentials.
          items:
            $ref: "#/components/schemas/ClientBindingInput"
    ClientPatchRequest:
      type: object
      required: [version]
      additionalProperties: false
      description: >-
        Presence-aware patch. Omitted fields are preserved, explicit null
        clears nullable/defaultable fields, and supplied values replace them.
      properties:
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version.
        name:
          type: string
        email:
          type: [string, "null"]
        enabled:
          type: [boolean, "null"]
        groupId:
          type: [string, "null"]
        quotaBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 9007199254740991
        quotaResetPolicy:
          type: [string, "null"]
          enum: [never, daily, weekly, monthly]
        quotaResetAt:
          type: [integer, "null"]
          format: int64
        expiresAt:
          type: [integer, "null"]
          format: int64
        deviceLimit:
          type: [integer, "null"]
          minimum: 0
        notes:
          type: [string, "null"]
    ClientBindingInput:
      type: object
      required: [inboundId]
      properties:
        inboundId:
          type: string
        runtimeIdentity:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,48}$'
        credential:
          type: string
          description: Optional explicit credential; server-generated when empty.
        enabled:
          type: boolean
    IssuedCredential:
      type: object
      required: [bindingId, inboundId, kind, plaintext]
      description: >-
        Server-generated credential returned exactly once at creation time.
        Only the encrypted form is persisted; the plaintext is never stored.
      properties:
        bindingId:
          type: string
        inboundId:
          type: string
        kind:
          type: string
        plaintext:
          type: string
    RevisionView:
      type: object
      required: [desired, applied, state]
      properties:
        desired:
          type: integer
        applied:
          type: integer
        state:
          type: string
          enum: [synced, pending, failed]
    ClientCreateResponse:
      type: object
      required: [client, revision, success]
      description: >-
        Atomic create envelope: the committed client, any server-generated
        credentials (plaintext shown exactly once), the new desired revision,
        and the apply job that ran for that revision. success=false means the
        client committed but the apply did not finish cleanly.
      properties:
        client:
          $ref: "#/components/schemas/ClientView"
        issuedCredentials:
          type: array
          items:
            $ref: "#/components/schemas/IssuedCredential"
        revision:
          $ref: "#/components/schemas/RevisionView"
        applyJob:
          $ref: "#/components/schemas/ApplyJob"
        success:
          type: boolean
    ClientView:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        enabled:
          type: boolean
        groupId:
          type: string
        quotaBytes:
          type: integer
          format: int64
          minimum: 0
          # Capped at Number.MAX_SAFE_INTEGER: the SPA consumes this as a
          # JS number; larger int64s would lose precision silently.
          maximum: 9007199254740991
        quotaResetPolicy:
          type: string
        quotaResetAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        deviceLimit:
          type: integer
        notes:
          type: string
        depleted:
          type: boolean
        status:
          type: string
          description: Effective status.
          enum: [active, disabled, expired, depleted, pending_apply, apply_failed, orphaned]
        inboundIds:
          type: array
          items:
            type: string
        hasCreds:
          type: boolean
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        version:
          type: integer
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/BindingView"
    BindingView:
      type: object
      required: [id, inboundId, runtimeIdentity, enabled, version]
      properties:
        id:
          type: string
        inboundId:
          type: string
        runtimeIdentity:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
        capability:
          $ref: "#/components/schemas/BindingCapability"
        credential:
          $ref: "#/components/schemas/CredentialMeta"
    BindingCapability:
      type: object
      required: [protocol, transports, perClientCredentials, requiresCaddy]
      properties:
        protocol:
          type: string
        transports:
          type: array
          items:
            type: string
        perClientCredentials:
          type: boolean
        requiresCaddy:
          type: boolean
    CredentialMeta:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        kind:
          type: string
        version:
          type: integer
        rotatedAt:
          type: integer
          format: int64
    ClientListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientView"
        total:
          type: integer
    SubscriptionTokenResponse:
      type: object
      required: [token, prefix]
      properties:
        token:
          type: string
          description: Full plaintext token, returned only once at issuance.
        prefix:
          type: string
          description: Public prefix used to identify the token.
        expiresAt:
          type: integer
          format: int64
    TrafficTotals:
      type: object
      required: [clientId, uploadBytes, downloadBytes, totalBytes, depleted]
      properties:
        clientId:
          type: string
        uploadBytes:
          type: integer
          format: int64
        downloadBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        quotaBytes:
          type: integer
          format: int64
          minimum: 0
          # Capped at Number.MAX_SAFE_INTEGER: the SPA consumes this as a
          # JS number; larger int64s would lose precision silently.
          maximum: 9007199254740991
        remainingBytes:
          type: integer
          format: int64
        depleted:
          type: boolean
    TrafficBucket:
      type: object
      required: [at, uploadBytes, downloadBytes]
      properties:
        at:
          type: integer
          format: int64
        uploadBytes:
          type: integer
          format: int64
        downloadBytes:
          type: integer
          format: int64
    TrafficHistoryResponse:
      type: object
      required: [clientId, from, to, bucket, items]
      properties:
        clientId:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        bucket:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrafficBucket"
    TrafficTopEntry:
      type: object
      required: [clientId, name, totalBytes]
      properties:
        clientId:
          type: string
        name:
          type: string
        uploadBytes:
          type: integer
          format: int64
        downloadBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
    TrafficTopResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrafficTopEntry"
