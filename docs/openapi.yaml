    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-veil-role: admin-metadata
      tags: [validation]
      summary: Validate a candidate configuration against live host state
      description: |
        Performs the same candidate and live-host checks used authoritatively
        before settings, Inbound, WARP, and apply mutations. The result may
        become stale if host state changes after this request; Veil validates
        again immediately before mutation.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRequest"
            examples:
              candidate:
                value:
                  settings:
                    panelListen: 127.0.0.1:2096
                    panelAccess: local
                    mode: server
                  inbounds:
                    - name: edge
                      protocol: mieru
                      transport: tcp
                      port: 443
                      enabled: true
                      password: "[REDACTED]"
                  warp:
                    enabled: false
                    endpoint: engage.cloudflareclient.com:2408
      responses:
        "200":
          description: Validation completed. Inspect `valid` and `issues`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
              examples:
                busy-port:
                  value:
                    valid: false
                    checkedAt: "2026-06-05T12:00:00Z"
                    issues:
                      - code: port_in_use
                        severity: error
                        field: port
                        inboundId: edge
                        message: TCP port 443 is already in use
                        remediation: Stop the conflicting service or choose another port.
                        source: live-host
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
