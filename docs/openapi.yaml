openapi: 3.1.0
info:
  title: Veil Panel API
  version: "0.6.2"
  description: |
    HTTP management API exposed by the Veil Panel (`veil serve`).

    ## Authentication model
    Veil is fail-closed for public Panel exposure. A non-loopback `--listen`
    address requires native TLS, API token authentication (`--auth-token` or
    `VEIL_API_TOKEN`), user/session authentication, and authenticated metrics.
    Caddy exposure requires user/session authentication and authenticated
    metrics even though the Veil listener remains on loopback.

    An unconfigured local loopback listener exposes only the first-run setup
    flow needed to create the initial administrator. Setup is unavailable
    through direct or Caddy exposure.

    `/api/*` routes accept either `X-Veil-Token`, `Authorization: Bearer`, or
    a `veil_session` cookie created by `/api/auth/login`. Mutating requests
    made with a cookie session must also send `X-CSRF-Token`, and only `admin`
    sessions may mutate management state. The sole viewer mutation exception
    is `POST /api/auth/locale`, which updates only the authenticated user's own
    language preference and rejects static API-token callers.

    Browser sessions survive Panel restarts. Only hashes of the session cookie
    and CSRF token are persisted. Sessions expire after 30 minutes idle or 24
    hours absolute and are revoked when a user's password, role, or existence
    changes.

    `/healthz`, `/metrics`, and the Panel UI are not treated as proof of
    authorization. On public listeners `/healthz` is authenticated, `/metrics`
    follows the separate metrics policy (`--metrics-access` /
    `VEIL_METRICS_ACCESS`), and the Panel UI renders only the login surface
    until a valid session exists.

    Validation and ordinary HTTP failures use a `text/plain` response body.
    Failures returned by the privileged helper use the structured
    `PrivilegedErrorEnvelope` JSON schema so operators and generated clients
    can distinguish policy, availability, validation, and execution failures.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: /
security:
  - veilToken: []
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: status
  - name: setup
  - name: auth
  - name: audit
  - name: admin
  - name: backups
  - name: settings
  - name: inbounds
  - name: routing
  - name: warp
  - name: client-links
  - name: validation
  - name: apply
  - name: runtime
  - name: diagnostics
  - name: services
  - name: version
paths:
  /healthz:
    get:
      tags: [status]
      summary: Liveness/readiness probe
      description: Authenticated on public Panel listeners; public on loopback-only development listeners.
      responses:
        "200":
          description: Panel is serving and state is accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: State path is configured but inaccessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                unhealthy:
                  value:
                    status: unhealthy
                    error: "stat /var/lib/veil/state.json: no such file or directory"
  /metrics:
    get:
      tags: [status]
      summary: Prometheus metrics exposition
      description: |
        Exposure is controlled independently with `--metrics-access` /
        `VEIL_METRICS_ACCESS`.
        `auto` authenticates metrics on public listeners and whenever auth is
        configured; `authenticated` always requires auth; `public` is accepted
        only for loopback listeners.
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
              examples:
                sample:
                  value: |
                    # HELP veil_uptime_seconds Veil process uptime in seconds.
                    # TYPE veil_uptime_seconds gauge
                    veil_uptime_seconds 12
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/setup/status:
    get:
      tags: [setup]
      summary: Inspect first-run setup state
      description: Available without authentication only on a local loopback listener.
      security: []
      responses:
        "200":
          description: Current setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
              examples:
                required:
                  value:
                    required: true
                    allowed: true
                    panelAccess: local
  /api/setup/complete:
    post:
      tags: [setup]
      summary: Create the initial administrator
      description: Single-use operation available only on an unconfigured local loopback listener.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
            examples:
              initial-admin:
                value:
                  username: admin
                  password: correct-horse-battery-staple
                  backupAcknowledged: true
                  locale: ru
      responses:
        "201":
          description: Initial administrator created and setup marked complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupCompleteResponse"
              examples:
                complete:
                  value:
                    completed: true
                    username: admin
                    role: admin
                    locale: ru
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Setup was already completed or a user already exists.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
  /api/auth/login:
    post:
      tags: [auth]
      summary: Create a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              admin:
                value:
                  username: admin
                  password: "correct horse battery staple"
      responses:
        "200":
          description: Login succeeded and a `veil_session` cookie was set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only `veil_session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                admin:
                  value:
                    success: true
                    username: admin
                    role: admin
                    locale: ru
                    csrfToken: 0123456789abcdef0123456789abcdef
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Delete the browser session cookie
      security: []
      responses:
        "200":
          description: Logout response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                ok:
                  value:
                    success: true
  /api/auth/status:
    get:
      tags: [auth]
      summary: Inspect the current browser session
      security: []
      responses:
        "200":
          description: Current session status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
              examples:
                authenticated:
                  value:
                    authenticated: true
                    username: admin
                    role: admin
                    locale: ru
                    csrfToken: 0123456789abcdef0123456789abcdef
                anonymous:
                  value:
                    authenticated: false
  /api/auth/locale:
    post:
      tags: [auth]
      summary: Update the current browser user's locale
      description: |
        Self-service exception available to both `admin` and `viewer` browser
        sessions. Requires the `veil_session` cookie and `X-CSRF-Token`,
        updates only that session's username, and sets a one-year
        `veil_locale` preference cookie. Static API tokens cannot call this
        endpoint.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocaleUpdateRequest"
            examples:
              russian:
                value:
                  locale: ru
      responses:
        "200":
          description: Locale persisted for the current user.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: SameSite `veil_locale` preference cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocaleResponse"
              examples:
                russian:
                  value:
                    locale: ru
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/sessions:
    get:
      tags: [auth]
      summary: List active browser sessions
      description: Requires an admin token or admin session.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Active sessions with stable revocation IDs. The current session is sorted first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
              examples:
                sessions:
                  value:
                    - id: 0123456789abcdef
                      username: admin
                      role: admin
                      createdAt: "2026-06-05T12:00:00Z"
                      lastSeenAt: "2026-06-05T12:10:00Z"
                      idleExpiresAt: "2026-06-05T12:40:00Z"
                      expiresAt: "2026-06-06T12:00:00Z"
                      userAgent: Mozilla/5.0
                      remoteAddr: 192.0.2.10
                      current: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [auth]
      summary: Revoke an active browser session
      description: Requires an admin token or admin session. Cookie sessions must include `X-CSRF-Token`.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionDeleteRequest"
            examples:
              revoke:
                value:
                  id: 0123456789abcdef
      responses:
        "200":
          description: Session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                ok:
                  value:
                    success: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/audit:
    get:
      tags: [audit]
      summary: List structured Panel audit history
      description: |
        Returns newest-first, redacted authentication and mutation events.
        Requires an admin token or admin session. The raw session cookie, CSRF
        token, passwords, and authorization values are never returned.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          required: false
          description: Return records strictly older than this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Bounded audit history and an optional backward-pagination cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
              examples:
                recent:
                  value:
                    items:
                      - timestamp: "2026-06-05T12:10:00Z"
                        actor: admin
                        role: admin
                        action: auth.session.revoke
                        target: 0123456789abcdef
                        ip: 192.0.2.10
                        success: true
                    nextBefore: "2026-06-05T12:10:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/rotate-key:
    post:
      tags: [admin]
      summary: Rotate the state-encryption key
      description: |
        Re-encrypts management state with a newly generated root-managed key.
        Requires admin role and CSRF for cookie sessions. All browser sessions
        except the initiating session are revoked after a successful rotation.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
            examples:
              rotate:
                value: {}
      responses:
        "200":
          description: State was re-encrypted and other sessions were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyRotationResponse"
              examples:
                rotated:
                  value:
                    success: true
                    revokedSessions: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PrivilegedFailure"
  /api/backups:
    get:
      tags: [backups]
      summary: List managed disaster-recovery archives
      description: Requires an admin token or admin session.
      responses:
        "200":
          description: Archives in newest-first order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupArchive"
              examples:
                managed:
                  value:
                    - name: veil_backup_20260605_020000.tar.gz.enc
                      path: /var/lib/veil/backups/veil_backup_20260605_020000.tar.gz.enc
                      size: 4096
                      createdAt: "2026-06-05T02:00:00Z"
                      encrypted: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [backups]
      summary: Create and verify an encrypted archive
      description: |
        Uses `/etc/veil/backup.passphrase` server-side. The passphrase is never
        accepted from or returned to the browser. Requires admin and CSRF for a
        cookie session.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupCreateRequest"
            examples:
              create-and-prune:
                value:
                  prune: true
                  daily: 7
                  weekly: 4
                  monthly: 12
      responses:
        "201":
          description: Archive created, persisted, and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/backups/prune:
    post:
      tags: [backups]
      summary: Apply managed archive retention
      description: Requires admin and CSRF for a cookie session.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPruneRequest"
            examples:
              standard:
                value:
                  daily: 7
                  weekly: 4
                  monthly: 12
      responses:
        "200":
          description: Retention result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPruneResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/backups/{name}/download:
    parameters:
      - $ref: "#/components/parameters/BackupName"
    get:
      tags: [backups]
      summary: Download an encrypted archive
      description: Requires an admin token or admin session.
      responses:
        "200":
          description: Encrypted backup bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="veil_backup_20260605_020000.tar.gz.enc"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/backups/{name}/verify:
    parameters:
      - $ref: "#/components/parameters/BackupName"
    post:
      tags: [backups]
      summary: Decrypt and verify an archive without writing state
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Verification and compatibility report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupVerificationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Archive decryption, checksum, state/key, or schema validation failed.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/backups/{name}/restore:
    parameters:
      - $ref: "#/components/parameters/BackupName"
    post:
      tags: [backups]
      summary: Queue a verified state and key restore
      description: |
        Requires explicit confirmation, admin, and CSRF for a cookie session.
        Successful restore preserves `.pre-restore-*` safety copies and revokes
        browser sessions after the initiating session reads the final job.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRestoreRequest"
            examples:
              confirmed:
                value:
                  confirm: true
      responses:
        "202":
          description: Restore job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRestoreJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Archive verification failed before the job was queued.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/backup-restore-jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/RestoreJobID"
    get:
      tags: [backups]
      summary: Read queued restore progress
      description: Requires an admin token or admin session.
      responses:
        "200":
          description: Current restore job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRestoreJob"
              examples:
                complete:
                  value:
                    id: 0123456789abcdef0123456789abcdef
                    archive: veil_backup_20260605_020000.tar.gz.enc
                    status: succeeded
                    createdAt: "2026-06-05T02:10:00Z"
                    startedAt: "2026-06-05T02:10:00Z"
                    finishedAt: "2026-06-05T02:10:01Z"
                    safetyStatePath: /var/lib/veil/state.json.pre-restore-20260605T021000.000000000Z
                    safetyKeyPath: /etc/veil/state.key.pre-restore-20260605T021000.000000000Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/users:
    get:
      tags: [auth]
      summary: List registered Panel users
      responses:
        "200":
          description: Registered users, roles, and locale preferences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      tags: [auth]
      summary: Create a Panel user
      description: Requires an admin token or admin session. Cookie sessions must include `X-CSRF-Token`.
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            examples:
              viewer:
                value:
                  username: operator
                  password: "change-this-password"
                  role: viewer
                  locale: en
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    put:
      tags: [auth]
      summary: Update a Panel user
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [auth]
      summary: Delete a Panel user
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: User deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/status:
    get:
      tags: [status]
      summary: Service status snapshot for managed systemd units
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                sample:
                  value:
                    schemaVersion: v1
                    name: Veil
                    version: v1.2.3
                    mode: server
                    services:
                      - name: veil
                        managed: true
                        unit: veil.service
                        loadState: loaded
                        activeState: active
                        subState: running
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/version:
    get:
      tags: [version]
      summary: Current Veil version
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/version/update:
    post:
      tags: [version]
      summary: Trigger a staged self-update to the latest release
      security:
        - veilToken: []
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Release archive was staged, re-verified by the helper, installed, and a Panel restart was scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
              examples:
                installed:
                  value:
                    success: true
                    staged: true
                    installed: true
                    version: v0.6.0
                    message: Update staged successfully. Restarting panel service...
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/PrivilegedFailure"
        "502":
          description: GitHub release metadata or assets could not be downloaded or verified.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/settings:
    get:
      tags: [settings]
      summary: Read Panel settings with secrets redacted
      responses:
        "200":
          description: Current settings.
          content:
