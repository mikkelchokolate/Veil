                    checkedAt: "2026-06-05T12:00:00Z"
                    issues:
                      - code: port_in_use
                        severity: error
                        field: port
                        inboundId: edge
                        message: TCP port 443 is already in use
                        remediation: Stop the conflicting service or choose another port.
                        source: live-host
