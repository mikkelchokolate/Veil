version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-modules:
        patterns:
          - "*"

  # directories covers the root Dockerfile AND ci/vm/Containerfile, whose
  # digest-pinned base images feed the local-CI image chain (#427).
  - package-ecosystem: docker
    directories:
      - /
      - /ci/vm
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions-updates:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /test/browser
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      browser-test-dependencies:
        patterns:
          - "*"
