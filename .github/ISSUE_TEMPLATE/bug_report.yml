name: Bug Report
description: File a bug report to help us improve Veil
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify that you are using the latest version of Veil before reporting a bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Install Veil ...
        2. Open Panel ...
        3. Click on ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics & Logs
      description: Attach output from `veil status`, systemd service logs, or browser console outputs if applicable.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Host OS
      options:
        - Ubuntu
        - Debian
        - Rocky Linux / AlmaLinux
        - Windows (WSL)
        - Other (please specify in description)
    validations:
      required: true
