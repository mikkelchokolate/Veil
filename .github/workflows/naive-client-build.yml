name: naive-client-build

# Builds the pinned naiveproxy linux-x64 client from source and mirrors it to
# the `ci-deps` prerelease (never a version release, never "latest"). Upstream
# klzgrad/naiveproxy removed all release binaries (#1373); this follows their
# own .github/workflows/build.yml `linux` job for target_cpu="x64".
#
# Every run is cold (no toolchain/sysroot/ccache restore, unlike upstream) to
# keep the build self-contained; the 360 min timeout is the hosted ceiling.
#
# Manual only. Refuses to overwrite an existing asset so a published checksum
# pinned in scripts/ci/versions.sh can never silently change.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: upstream klzgrad/naiveproxy tag
        default: v150.0.7871.63-1
        required: true
      commit:
        description: expected commit SHA of that tag
        default: 3ba967e2d36cc133a896e81a36257ad4c6ea20f4
        required: true

permissions:
  contents: read

concurrency:
  group: naive-client-build
  cancel-in-progress: false

jobs:
  build-linux-x64:
    # Only reviewed workflow code on main may attest/publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ inputs.commit }}
      EXTRA_FLAGS: 'target_cpu="x64"'
      BUNDLE: naiveproxy-${{ inputs.tag }}-linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate inputs
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "bad tag ${TAG}"; exit 1; }
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "bad commit ${COMMIT}"; exit 1; }
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: klzgrad/naiveproxy
          ref: ${{ inputs.commit }}
          path: naiveproxy
          persist-credentials: false
      - name: Verify checkout matches tag
        working-directory: naiveproxy
        run: |
          test "$(git rev-parse HEAD)" = "${COMMIT}"
          test "$(git ls-remote https://github.com/klzgrad/naiveproxy "refs/tags/${TAG}" | cut -f1)" = "${COMMIT}"
      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bubblewrap
      - name: Regenerate Debian keyring
        working-directory: naiveproxy/src
        run: |
          rm -f ./build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./build/linux/sysroot_scripts/generate_keyring.sh
      - name: get-clang.sh
        working-directory: naiveproxy/src
        run: ./get-clang.sh
      - name: build.sh
        working-directory: naiveproxy/src
        run: ./build.sh
      - name: Upstream smoke test
        working-directory: naiveproxy/src
        run: ../tests/basic.sh out/Release/naive
      - name: Pack (upstream bundle layout)
        id: pack
        working-directory: naiveproxy/src
        run: |
          mkdir "${BUNDLE}"
          cp out/Release/naive config.json ../LICENSE ../USAGE.txt "${BUNDLE}"
          tar cJf "${BUNDLE}.tar.xz" "${BUNDLE}"
          tarball_sha="$(sha256sum "${BUNDLE}.tar.xz" | cut -d' ' -f1)"
          naive_sha="$(sha256sum out/Release/naive | cut -d' ' -f1)"
          cat > "${BUNDLE}.provenance.txt" <<PROV
          asset: ${BUNDLE}.tar.xz
          sha256: ${tarball_sha}
          naive_executable_sha256: ${naive_sha}
          source: https://github.com/klzgrad/naiveproxy
          tag: ${TAG}
          commit: ${COMMIT}
          build: upstream src/get-clang.sh + src/build.sh, EXTRA_FLAGS=${EXTRA_FLAGS}, ubuntu-22.04
          workflow_run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          workflow_ref: ${GITHUB_WORKFLOW_REF}
          workflow_sha: ${GITHUB_SHA}
          reproducible: no (tar mtimes/owners differ per run); the checksum identifies THIS build only
          PROV
          sed -i 's/^ *//' "${BUNDLE}.provenance.txt"
          echo "${tarball_sha}  ${BUNDLE}.tar.xz" > "${BUNDLE}.tar.xz.sha256"
          echo "tarball=naiveproxy/src/${BUNDLE}.tar.xz" >>"$GITHUB_OUTPUT"
          { echo "### naiveproxy ${TAG} linux-x64"; echo; echo '```'; cat "${BUNDLE}.provenance.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      # Keep the build even if attestation or publishing fails: the artifact is
      # the durable output; the release upload is a separate, retryable job.
      - name: Upload build as artifact (before any publish)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE }}
          path: |
            naiveproxy/src/${{ env.BUNDLE }}.tar.xz
            naiveproxy/src/${{ env.BUNDLE }}.tar.xz.sha256
            naiveproxy/src/${{ env.BUNDLE }}.provenance.txt
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

  publish:
    needs: build-linux-x64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # upload assets to the existing ci-deps prerelease
      attestations: read   # bind the published bytes to the build provenance
    env:
      BUNDLE: naiveproxy-${{ inputs.tag }}-linux-x64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BUNDLE }}
          path: dist
      - name: Verify artifact checksum
        working-directory: dist
        run: sha256sum --check "${BUNDLE}.tar.xz.sha256"
      - name: Verify build provenance attestation
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "${BUNDLE}.tar.xz" -R "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/naive-client-build.yml" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      # The workflow never creates the ci-deps release/tag itself: creating a
      # tag with GITHUB_TOKEN at a commit whose workflow files differ from the
      # default branch is refused (HTTP 403 "Resource not accessible by
      # integration", run 39822544380) because GITHUB_TOKEN can never hold the
      # `workflows` permission. The owner creates ci-deps once, by hand.
      - name: Publish to existing ci-deps prerelease (never overwrite)
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view ci-deps >/dev/null 2>&1; then
            echo "::error::ci-deps prerelease does not exist; the owner must create it (gh release create ci-deps --prerelease --latest=false). The build artifact ${BUNDLE} is kept on this run."
            exit 1
          fi
          test "$(gh release view ci-deps --json isPrerelease -q .isPrerelease)" = true
          if gh release view ci-deps --json assets -q '.assets[].name' | grep -Fx "${BUNDLE}.tar.xz" >/dev/null; then
            echo "::error::${BUNDLE}.tar.xz already exists on ci-deps; refusing to overwrite a pinned asset (if a previous run uploaded only part of the asset set, delete the partial ci-deps assets manually after review, then re-run)"
            exit 1
          fi
          gh release upload ci-deps "${BUNDLE}.tar.xz" "${BUNDLE}.tar.xz.sha256" "${BUNDLE}.provenance.txt"
