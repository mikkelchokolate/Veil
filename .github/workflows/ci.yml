name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# All job logic lives in scripts/ci/*.sh — this workflow only provisions the
# toolchain versions from the single source of truth (scripts/ci/versions.sh)
# and invokes the shared scripts. Local runs (`make ci`, `make ci-pr`) execute
# the very same scripts inside a VM on the same Ubuntu 24.04 user-space.

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "node_version=${CI_NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=${CI_PNPM_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: frontend job
        run: bash scripts/ci/frontend.sh
      - name: Upload source-keyed frontend dist
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
          if-no-files-found: error
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend
          path: .artifacts/ci/
          if-no-files-found: ignore

  test:
    needs: frontend
    env:
      CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download source-keyed frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_version=${CI_GO_VERSION}"; echo "node_version=${CI_NODE_VERSION}"; echo "pnpm_version=${CI_PNPM_VERSION}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: runtime probe sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: test job
        run: bash scripts/ci/test.sh
      - name: Upload CI artifacts (incl. product-test.log and coverage)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test
          path: .artifacts/ci/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "go_version=${CI_GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - name: shellcheck (runner package)
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint job
        run: bash scripts/ci/lint.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lint
          path: .artifacts/ci/
          if-no-files-found: ignore

  multi-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "go_version=${CI_GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - name: multi-process job
        run: bash scripts/ci/multi-process.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-multi-process
          path: .artifacts/ci/
          if-no-files-found: ignore

  sigkill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "go_version=${CI_GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - name: SIGKILL recovery job
        run: bash scripts/ci/sigkill.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-sigkill
          path: .artifacts/ci/
          if-no-files-found: ignore

  filesystem-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "go_version=${CI_GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - name: filesystem fault-injection job
        run: bash scripts/ci/filesystem-faults.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-filesystem-faults
          path: .artifacts/ci/
          if-no-files-found: ignore

  privilege-boundary:
    needs: frontend
    env:
      CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download source-keyed frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_version=${CI_GO_VERSION}"; echo "node_version=${CI_NODE_VERSION}"; echo "pnpm_version=${CI_PNPM_VERSION}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: privilege-boundary job
        run: bash scripts/ci/privilege-boundary.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-privilege-boundary
          path: .artifacts/ci/
          if-no-files-found: ignore

  e2e:
    needs: frontend
    env:
      CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download source-keyed frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_version=${CI_GO_VERSION}"; echo "node_version=${CI_NODE_VERSION}"; echo "pnpm_version=${CI_PNPM_VERSION}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: runtime probe sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: e2e job (real pinned protocol runtimes)
        run: bash scripts/ci/e2e.sh
      - name: Upload CI artifacts (incl. protocol logs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e
          path: .artifacts/ci/
          if-no-files-found: ignore

  browser-e2e:
    needs: frontend
    env:
      CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download source-keyed frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_version=${CI_GO_VERSION}"; echo "node_version=${CI_NODE_VERSION}"; echo "pnpm_version=${CI_PNPM_VERSION}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Provision Chromium (runner-side provisioning, pinned version)
        working-directory: test/browser
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: browser-e2e job
        run: bash scripts/ci/browser-e2e.sh
      - name: Upload CI artifacts (incl. panel logs and Playwright reports)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-browser-e2e
          path: .artifacts/ci/
          if-no-files-found: ignore

  package-smoke:
    needs: frontend
    env:
      CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download source-keyed frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_version=${CI_GO_VERSION}"; echo "node_version=${CI_NODE_VERSION}"; echo "pnpm_version=${CI_PNPM_VERSION}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: package-smoke job
        run: bash scripts/ci/package-smoke.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-package-smoke
          path: .artifacts/ci/
          if-no-files-found: ignore

  image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: image-build job
        run: bash scripts/ci/image-build.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image-build
          path: .artifacts/ci/
          if-no-files-found: ignore
