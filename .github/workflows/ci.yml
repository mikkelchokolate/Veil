name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - run: go vet ./...
      - name: Validate OpenAPI
        run: make verify-openapi
      - name: Verify generated Go SDK
        run: make verify-sdk
      - run: make build
      - name: Test generated SDK with race detector
        run: go test ./sdk/go -race -count=1
      - name: Test product code with race detector and coverage
        run: |
          set -o pipefail
          packages="$(go list ./... | grep -v '/sdk/go$')"
          go test ${packages} -race -count=1 -coverprofile=coverage.out 2>&1 | tee product-test.log
      - name: Archive failed product test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-test-log
          path: product-test.log
      - name: Verify coverage threshold (min 70%)
        run: |
          total_coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total statement coverage is $total_coverage%"
          awk -v cov="$total_coverage" 'BEGIN { if (cov < 70.0) { print "Error: coverage " cov "% is below threshold (70.0%)"; exit 1 } }'
      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage-report
          path: coverage.out
      - run: bash -n scripts/install.sh scripts/uninstall.sh scripts/package-smoke.sh
      - run: sh -n packaging/scripts/*.sh
      - run: bash scripts/install.sh --help >/dev/null
      - run: bash scripts/uninstall.sh --help >/dev/null
      - run: git diff --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: '2026.1'
          install-go: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh packaging/scripts/*.sh

  privilege-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'
      - name: Verify systemd socket activation
        run: go test -tags linuxintegration ./internal/privileged -run TestSystemdSocketActivationAdoptsFD3 -count=1 -v
      - name: Verify helper socket and filesystem access matrix
        run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags linuxintegration ./test/linuxintegration/... -count=1 -v
      - name: Validate hardened systemd units
        run: |
          go build -o /tmp/veil-unit-verify ./cmd/veil
          sudo install -m 0755 /tmp/veil-unit-verify /usr/local/bin/veil
          for bin in caddy hysteria mita olcrtc sing-box; do
            sudo ln -sf /usr/local/bin/veil "/usr/local/bin/${bin}"
          done
          systemd-analyze verify packaging/systemd/*.service packaging/systemd/*.socket packaging/systemd/*.timer

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'
      - name: Build and install Veil
        run: |
          go build -o /tmp/veil-e2e ./cmd/veil
          sudo install -m 0755 /tmp/veil-e2e /usr/local/bin/veil
      - name: Install real server protocol runtimes
        run: |
          set -euo pipefail
          sudo veil runtime install --only hysteria2
          sudo veil runtime install --only naiveproxy
          sudo veil runtime install --only mieru
          /usr/local/bin/caddy list-modules | grep -Fx http.handlers.forward_proxy
          command -v hysteria
          command -v caddy
          command -v mita
      - name: Install real Mieru client
        run: |
          set -euo pipefail
          arch=amd64
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/enfein/mieru/releases/latest)"
          asset_url="$(jq -er --arg arch "$arch" '.assets[] | select(.name | test("^mieru_.*_linux_" + $arch + "\\.tar\\.gz$")) | .browser_download_url' <<<"$release_json" | head -n1)"
          curl --fail --silent --show-error --location "$asset_url" -o /tmp/mieru-client.tar.gz
          rm -rf /tmp/mieru-client && mkdir -p /tmp/mieru-client
          tar -xzf /tmp/mieru-client.tar.gz -C /tmp/mieru-client
          client_bin="$(find /tmp/mieru-client -type f -name mieru -perm -u+x | head -n1)"
          test -n "$client_bin"
          sudo install -m 0755 "$client_bin" /usr/local/bin/mieru
          mieru version
      - name: Install real NaiveProxy client
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/klzgrad/naiveproxy/releases/latest)"
          asset_url="$(jq -er '.assets[] | select(.name | test("^naiveproxy-v.*-linux-x64\\.tar\\.xz$")) | .browser_download_url' <<<"$release_json" | head -n1)"
          curl --fail --silent --show-error --location "$asset_url" -o /tmp/naiveproxy.tar.xz
          rm -rf /tmp/naiveproxy && mkdir -p /tmp/naiveproxy
          tar -xJf /tmp/naiveproxy.tar.xz -C /tmp/naiveproxy
          naive_bin="$(find /tmp/naiveproxy -type f -name naive -perm -u+x | head -n1)"
          test -n "$naive_bin"
          sudo install -m 0755 "$naive_bin" /usr/local/bin/naive
          naive --version
      - name: Assert protocol binaries are real
        run: |
          set -euo pipefail
          for bin in caddy naive mita mieru hysteria; do
            command -v "$bin"
            test "$(readlink -f "$(command -v "$bin")")" != /usr/local/bin/veil
          done
      - name: Mieru TCP through panel-generated configuration
        run: |
          set -o pipefail
          go test -tags e2e ./test/e2e/... -run '^TestRequiredMieruTCPDataPath$' -count=1 -v -timeout=90s 2>&1 | tee /tmp/mieru-tcp.log
      - name: Mieru UDP through panel-generated configuration
        run: |
          set -o pipefail
          go test -tags e2e ./test/e2e/... -run '^TestRequiredMieruUDPDataPath$' -count=1 -v -timeout=90s 2>&1 | tee /tmp/mieru-udp.log
      - name: NaiveProxy through panel-generated configuration
        run: |
          set -o pipefail
          go test -tags e2e ./test/e2e/... -run '^TestRequiredNaiveProxyDataPath$' -count=1 -v -timeout=90s 2>&1 | tee /tmp/naiveproxy.log
      - name: Archive real protocol diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-protocol-e2e-diagnostics
          path: |
            /tmp/mieru-tcp.log
            /tmp/mieru-udp.log
            /tmp/naiveproxy.log
          if-no-files-found: error

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'
      - name: Build Veil browser-test binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=browser-e2e" -o dist/veil ./cmd/veil
      - name: Install pinned Playwright
        working-directory: test/browser
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Start authenticated Panel
        run: |
          set -euo pipefail
          browser_root="${RUNNER_TEMP}/veil-browser"
          mkdir -p "${browser_root}/state" "${browser_root}/etc" "${browser_root}/apply" "${browser_root}/live"
          export VEIL_STATE_PATH="${browser_root}/state/state.json"
          export VEIL_KEY_PATH="${browser_root}/etc/state.key"
          export VEIL_APPLY_ROOT="${browser_root}/apply"
          export VEIL_LIVE_ROOT="${browser_root}/live"
          ./dist/veil admin set --username browser-admin --password 'Browser-E2E-Password-123!' --role admin --state "${VEIL_STATE_PATH}" --key-path "${VEIL_KEY_PATH}"
          VEIL_API_TOKEN=browser-e2e-token ./dist/veil serve --listen 127.0.0.1:2096 >"${RUNNER_TEMP}/veil-browser.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/veil-browser.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:2096/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/veil-browser.log" >&2
          exit 1
      - name: Browser end-to-end tests
        working-directory: test/browser
        env:
          VEIL_BROWSER_BASE_URL: http://127.0.0.1:2096
          VEIL_BROWSER_USERNAME: browser-admin
          VEIL_BROWSER_PASSWORD: Browser-E2E-Password-123!
        run: npm test
      - name: Stop Panel
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/veil-browser.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/veil-browser.pid")" 2>/dev/null || true
          fi
      - name: Archive browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-diagnostics
          path: |
            test/browser/playwright-report
            test/browser/test-results
            ${{ runner.temp }}/veil-browser.log
          if-no-files-found: ignore

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.5'
      - name: Build package payload
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=package-smoke" -o dist/veil ./cmd/veil
      - name: Install pinned nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0
      - name: Install and upgrade native packages in clean distributions
        run: |
          set -o pipefail
          bash scripts/package-smoke.sh 2>&1 | tee package-smoke.log
      - name: Archive package smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-smoke-diagnostics
          path: |
            package-smoke.log
            dist/package-smoke
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Docker image build and version verification
        run: |
          version="ci-${GITHUB_SHA}"
          docker build --pull --build-arg "VERSION=${version}" --tag veil:ci .
          docker run --rm veil:ci version | tee /tmp/veil-version.txt
          grep -F "${version}" /tmp/veil-version.txt
