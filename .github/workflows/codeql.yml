name: codeql

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '28 3 * * *'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file keeps CodeQL on the same Go as required CI:
      # verify_versions.py fails when go.mod's directive diverges from
      # CI_GO_VERSION, so go.mod IS the pinned source of truth (#421).
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare embedded web assets
        if: matrix.language == 'go'
        run: |
          if [ ! -f web/dist/index.html ]; then
            mkdir -p web/dist
            printf '%s\n' '<!doctype html><title>CodeQL analysis stub</title>' > web/dist/index.html
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          dependency-caching: true

      - name: Build Go database
        if: matrix.language == 'go'
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          # Preserve Go's base-branch category so PR alert diffing can close
          # existing findings; new interpreted-language scans stay distinct.
          category: "${{ matrix.language == 'go' && '.github/workflows/codeql.yml:analyze' || format('/language:{0}', matrix.language) }}"
