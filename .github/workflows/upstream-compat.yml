name: upstream-compat

# Scheduled compatibility check against the LATEST upstream protocol runtime
# releases. Required CI (ci.yml) is fully pinned via scripts/ci/versions.sh;
# this workflow is the early-warning channel for upstream drift.
#
# It never changes pinned versions automatically and is NOT a required check
# for pull requests.

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_version=${CI_GO_VERSION}"; echo "node_version=${CI_NODE_VERSION}"; echo "pnpm_version=${CI_PNPM_VERSION}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Report pinned vs latest upstream releases
        run: |
          set -euo pipefail
          source scripts/ci/versions.sh
          {
            echo "Pinned baseline:"
            echo "  hysteria ${CI_HYSTERIA_TAG} | mita ${CI_MITA_TAG} | naiveproxy-client ${CI_NAIVE_CLIENT_TAG} | sing-box ${CI_SINGBOX_TAG}"
            echo ""
            echo "| runtime | pinned | latest |"
            echo "|---|---|---|"
            for repo in apernet/hysteria enfein/mieru klzgrad/naiveproxy SagerNet/sing-box; do
              latest="$(curl --fail --silent --show-error --location "https://api.github.com/repos/${repo}/releases/latest" | jq -r .tag_name)"
              case "${repo}" in
                apernet/hysteria)    pinned="${CI_HYSTERIA_TAG}" ;;
                enfein/mieru)        pinned="${CI_MITA_TAG}" ;;
                klzgrad/naiveproxy)  pinned="${CI_NAIVE_CLIENT_TAG}" ;;
                SagerNet/sing-box)   pinned="${CI_SINGBOX_TAG}" ;;
              esac
              mark=""; [ "${pinned}" != "${latest}" ] && mark=" (drift)"
              echo "| ${repo} | ${pinned} | ${latest}${mark} |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build web/dist (embedded into the binary)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build and install Veil
        run: |
          go build -o /tmp/veil-compat ./cmd/veil
          sudo install -m 0755 /tmp/veil-compat /usr/local/bin/veil

      - name: Install LATEST server protocol runtimes via product installer
        run: |
          set -euo pipefail
          sudo veil runtime install --only hysteria2
          sudo veil runtime install --only naiveproxy
          sudo veil runtime install --only mieru
          /usr/local/bin/caddy list-modules | grep -Fx http.handlers.forward_proxy

      - name: Install LATEST Mieru client
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/enfein/mieru/releases/latest)"
          asset_url="$(jq -er '.assets[] | select(.name | test("^mieru_.*_linux_amd64\\.tar\\.gz$")) | .browser_download_url' <<<"$release_json" | head -n1)"
          curl --fail --silent --show-error --location "$asset_url" -o /tmp/mieru-client.tar.gz
          rm -rf /tmp/mieru-client && mkdir -p /tmp/mieru-client
          tar -xzf /tmp/mieru-client.tar.gz -C /tmp/mieru-client
          client_bin="$(find /tmp/mieru-client -type f -name mieru -perm -u+x | head -n1)"
          sudo install -m 0755 "$client_bin" /usr/local/bin/mieru
          mieru version

      - name: Install LATEST NaiveProxy client
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/klzgrad/naiveproxy/releases/latest)"
          asset_url="$(jq -er '.assets[] | select(.name | test("^naiveproxy-v.*-linux-x64\\.tar\\.xz$")) | .browser_download_url' <<<"$release_json" | head -n1)"
          curl --fail --silent --show-error --location "$asset_url" -o /tmp/naiveproxy.tar.xz
          rm -rf /tmp/naiveproxy && mkdir -p /tmp/naiveproxy
          tar -xJf /tmp/naiveproxy.tar.xz -C /tmp/naiveproxy
          naive_bin="$(find /tmp/naiveproxy -type f -name naive -perm -u+x | head -n1)"
          sudo install -m 0755 "$naive_bin" /usr/local/bin/naive
          naive --version

      - name: "Compatibility: protocol data paths against latest runtimes"
        run: |
          set -o pipefail
          {
            go test -tags e2e ./test/e2e/... -run '^TestRequiredHysteria2DataPath$' -count=1 -v -timeout=90s
            go test -tags e2e ./test/e2e/... -run '^TestRequiredMieruTCPDataPath$' -count=1 -v -timeout=90s
            go test -tags e2e ./test/e2e/... -run '^TestRequiredMieruUDPDataPath$' -count=1 -v -timeout=90s
            go test -tags e2e ./test/e2e/... -run '^TestRequiredNaiveProxyDataPath$' -count=1 -v -timeout=90s
          } 2>&1 | tee upstream-compat.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-compat-diagnostics
          path: upstream-compat.log
          if-no-files-found: ignore
