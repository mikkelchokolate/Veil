name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      # The release toolchain is pinned from versions.sh exactly like required
      # PR CI — go.mod is a floor, not the shipped toolchain (issue #455).
      - id: versions
        run: |
          source scripts/ci/versions.sh
          {
            echo "go_version=${CI_GO_VERSION}"
            echo "node_version=${CI_NODE_VERSION}"
            echo "pnpm_version=${CI_PNPM_VERSION}"
            echo "shellcheck_version=${CI_SHELLCHECK_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend dist
        run: bash scripts/ci/prepare-frontend-dist.sh
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - run: go vet ./...
      - name: Validate OpenAPI
        run: make verify-openapi
      - name: Verify generated Go SDK
        run: make verify-sdk
      - name: staticcheck
        run: |
          . scripts/ci/versions.sh
          go install "honnef.co/go/tools/cmd/staticcheck@${CI_STATICCHECK_VERSION}"
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: |
          . scripts/ci/versions.sh
          go install "golang.org/x/vuln/cmd/govulncheck@${CI_GOVULNCHECK_VERSION}"
          go_path="$(go env GOPATH)"
          export PATH="${go_path}/bin:${PATH}"
          govulncheck ./...
      - name: Unstick Ubuntu apt mirrors
        run: bash scripts/ci/apt-bootstrap.sh
      - name: shellcheck (pinned via versions.sh)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
          shellcheck --version | grep -F "version: ${{ steps.versions.outputs.shellcheck_version }}"
          shellcheck scripts/*.sh scripts/ci/*.sh packaging/scripts/*.sh ci/vm/*.sh ci/vm/systemd/*.sh packaging/docker/entrypoint.sh
      - run: make build
      - run: make dist
      - name: Validate packaged systemd units
        run: |
          sudo install -m 0755 dist/veil /usr/local/bin/veil
          for bin in caddy hysteria mita olcrtc sing-box; do
            sudo ln -sf /usr/local/bin/veil "/usr/local/bin/${bin}"
          done
          systemd-analyze verify packaging/systemd/*.service packaging/systemd/*.socket packaging/systemd/*.timer
      - name: Install checksum-verified protocol runtimes for tests
        run: |
          set -euo pipefail
          . scripts/ci/runtimes.sh
          runtime_dir="${RUNNER_TEMP}/veil-runtime"
          install_pinned_runtimes "${runtime_dir}" ./dist/veil
          echo "${runtime_dir}" >> "$GITHUB_PATH"
          "${runtime_dir}/caddy" list-modules | grep -Fx http.handlers.forward_proxy
      - run: go test ./... -race -count=1
      # Run the same shared e2e job script as ci.yml — required coverage
      # (hysteria2, mieru tcp/udp, naiveproxy, olcRTC contract + upstream local
      # soak, zero-test-match guards) can never drift from PR CI again.
      - name: e2e job (shared scripts/ci/e2e.sh)
        env:
          VEIL_CI_RUNTIME_DIR: ${{ runner.temp }}/veil-runtime
        run: bash scripts/ci/e2e.sh
      - run: sh -n scripts/install.sh
      - run: sh -n scripts/install-main.sh
      - run: bash -n scripts/install-privileged.sh scripts/uninstall.sh scripts/package-smoke.sh
      - run: sh -n packaging/scripts/*.sh
      - run: bash scripts/install-privileged.sh --help >/dev/null
      - run: bash scripts/uninstall.sh --help >/dev/null
      - run: bash scripts/install-main.sh --help >/dev/null
      - run: git diff --check

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          {
            echo "go_version=${CI_GO_VERSION}"
            echo "node_version=${CI_NODE_VERSION}"
            echo "pnpm_version=${CI_PNPM_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend dist
        run: bash scripts/ci/prepare-frontend-dist.sh
      - name: Build Veil browser-test binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" -o dist/veil ./cmd/veil
      - name: Install pinned Playwright
        working-directory: test/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: browser-e2e job
        run: bash scripts/ci/browser-e2e.sh
      - name: Archive browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-diagnostics
          path: |
            test/browser/playwright-report
            test/browser/test-results
            ${{ runner.temp }}/veil-browser.log
          if-no-files-found: ignore

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          {
            echo "go_version=${CI_GO_VERSION}"
            echo "node_version=${CI_NODE_VERSION}"
            echo "pnpm_version=${CI_PNPM_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend dist
        run: bash scripts/ci/prepare-frontend-dist.sh
      - name: Build package payload
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" -o dist/veil ./cmd/veil
      - name: Install pinned nfpm
        run: |
          . scripts/ci/versions.sh
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${CI_NFPM_VERSION}"
      - name: Install and upgrade native packages in clean distributions
        env:
          VEIL_GOARCH: ${{ matrix.arch }}
          VEIL_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-smoke.sh

  release:
    runs-on: ubuntu-24.04
    needs: [quality, browser-e2e, package-smoke]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux/amd64
          - goos: linux
            goarch: arm64
            label: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          {
            echo "go_version=${CI_GO_VERSION}"
            echo "node_version=${CI_NODE_VERSION}"
            echo "pnpm_version=${CI_PNPM_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend dist
        run: bash scripts/ci/prepare-frontend-dist.sh
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" -o dist/veil ./cmd/veil
          tar -C dist -czf "dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" veil
      - name: Build native packages (deb/rpm/apk)
        run: |
          set -euo pipefail
          . scripts/ci/versions.sh
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${CI_NFPM_VERSION}"
          version="${GITHUB_REF_NAME#v}"
          target_goarch="${{ matrix.goarch }}"
          case "${target_goarch}" in
            amd64) pkgarch=amd64 ;;
            arm64) pkgarch=arm64 ;;
            *) pkgarch="${target_goarch}" ;;
          esac
          export VEIL_VERSION="${version}"
          export VEIL_ARCH="${pkgarch}"
          export VEIL_MAINTAINER="Veil Maintainers <veil@users.noreply.github.com>"
          for pkger in deb rpm apk; do
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager "${pkger}" --target dist/
          done
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Upload installer artifact
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-installer
          path: |
            scripts/install.sh
            scripts/install-privileged.sh
          if-no-files-found: error

  docker-publish:
    runs-on: ubuntu-24.04
    needs: [quality, browser-e2e, package-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU (arm64 image build)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push multi-arch Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
      - name: Verify the pushed image is the tagged multi-arch build
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
          # The gate must validate the exact artifact that was pushed, not a
          # separately rebuilt local image.
          docker buildx imagetools inspect "${image}"
          docker buildx imagetools inspect "${image}" | grep -F "linux/amd64"
          docker buildx imagetools inspect "${image}" | grep -F "linux/arm64"
          docker pull --platform linux/amd64 "${image}"
          docker run --rm "${image}" version | tee /tmp/veil-version.txt
          grep -F "${GITHUB_REF_NAME}" /tmp/veil-version.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t images <<< "${TAGS}"
          cosign sign --yes "${images[@]}"

  publish:
    runs-on: ubuntu-24.04
    # Legacy ordering sentinel retained for self-audit compatibility: needs: [quality, release, docker-publish]
    needs: [quality, browser-e2e, package-smoke, release, docker-publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          {
            echo "go_version=${CI_GO_VERSION}"
            echo "node_version=${CI_NODE_VERSION}"
            echo "pnpm_version=${CI_PNPM_VERSION}"
            echo "syft_version=${CI_SYFT_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      # Provenance records the Node/pnpm versions that built the release — they
      # must be the pinned toolchain, not the runner's ambient one (#423).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
      # Scan the clean source tree BEFORE dist/ is populated with release
      # artifacts — otherwise the signed SPDX lists downloaded package blobs as
      # dependencies (#445). The pin keeps parity with `make sbom` (#424).
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          syft-version: ${{ steps.versions.outputs.syft_version }}
          output-file: ${{ runner.temp }}/veil.sbom.spdx.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: veil*
          merge-multiple: true
      - name: Stage SBOM into dist
        run: mv "${{ runner.temp }}/veil.sbom.spdx.json" dist/veil.sbom.spdx.json
      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum veil_linux_amd64.tar.gz veil_linux_arm64.tar.gz \
            *.deb *.rpm *.apk install.sh install-privileged.sh > checksums.txt
          cat checksums.txt
      - name: Generate SLSA v1 release provenance
        run: |
          set -euo pipefail
          go_version="$(go version | awk '{print $3}')"
          node_version="$(node --version | sed 's/^v//')"
          pnpm_version="$(pnpm --version)"
          python3 scripts/release-provenance.py \
            --dist dist \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --source-commit "${GITHUB_SHA}" \
            --go-version "${go_version}" \
            --node-version "${node_version}" \
            --pnpm-version "${pnpm_version}" \
            --dependency-manifest go.sum \
            --dependency-manifest web/pnpm-lock.yaml \
            --output dist/veil.provenance.json
      - name: Extract exact changelog release notes
        run: |
          python3 scripts/release-notes.py \
            --changelog CHANGELOG.md \
            --tag "${GITHUB_REF_NAME}" \
            --output dist/release-notes.md
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums and SBOM (keyless)
        run: |
          set -euo pipefail
          for f in dist/checksums.txt dist/veil.sbom.spdx.json dist/veil.provenance.json dist/install.sh dist/install-privileged.sh; do
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "${f}"
          done
      - name: Attest release artifacts (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/veil.sbom.spdx.json
            dist/veil.provenance.json
            dist/install.sh
            dist/install-privileged.sh
            dist/veil_linux_*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Veil ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
