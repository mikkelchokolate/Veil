name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
      - run: make build
      - run: go test ./... -race -count=1
      - run: bash -n scripts/install.sh scripts/uninstall.sh
      - run: bash scripts/install.sh --help >/dev/null
      - run: bash scripts/uninstall.sh --help >/dev/null
      - run: git diff --check

  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux/amd64
          - goos: linux
            goarch: arm64
            label: linux/arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/veil ./cmd/veil
          tar -C dist -czf "dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" veil
      - name: Build native packages (deb/rpm/apk)
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          version="${GITHUB_REF_NAME#v}"
          case "${{ matrix.goarch }}" in
            amd64) pkgarch=amd64 ;;
            arm64) pkgarch=arm64 ;;
            *) pkgarch="${{ matrix.goarch }}" ;;
          esac
          export VEIL_VERSION="${version}"
          export VEIL_ARCH="${pkgarch}"
          export VEIL_MAINTAINER="Veil Maintainers <veil@users.noreply.github.com>"
          for pkger in deb rpm apk; do
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager "${pkger}" --target dist/
          done
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk

  publish:
    runs-on: ubuntu-latest
    needs: [quality, release]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum veil_linux_amd64.tar.gz veil_linux_arm64.tar.gz \
            *.deb *.rpm *.apk > checksums.txt
          cat checksums.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/veil.sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign checksums and SBOM (keyless)
        run: |
          set -euo pipefail
          for f in dist/checksums.txt dist/veil.sbom.spdx.json; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Veil ${GITHUB_REF_NAME}" \
            --notes "Automated Veil release with Linux amd64/arm64 archives, native deb/rpm/apk packages, checksums, SBOM, and keyless cosign signatures."
