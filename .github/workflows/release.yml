name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.5'
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - run: go vet ./...
      - name: Validate OpenAPI
        run: make verify-openapi
      - name: Verify generated Go SDK
        run: make verify-sdk
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: '2026.1'
          install-go: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh packaging/scripts/*.sh
      - run: make build
      - run: make dist
      - name: Validate packaged systemd units
        run: |
          sudo install -m 0755 dist/veil /usr/local/bin/veil
          for bin in caddy hysteria mita olcrtc sing-box; do
            sudo ln -sf /usr/local/bin/veil "/usr/local/bin/${bin}"
          done
          systemd-analyze verify packaging/systemd/*.service packaging/systemd/*.socket packaging/systemd/*.timer
      - name: Install real protocol runtime binaries for e2e tests
        run: |
          set -euo pipefail
          # Replace the veil stubs with actual upstream binaries so data-path tests
          # exercise real protocol clients/servers instead of failing silently.
          sudo veil runtime install --only hysteria2
          sudo veil runtime install --only naiveproxy
          sudo veil runtime install --only mieru
          command -v hysteria
          command -v mita
      - name: Install real Mieru client
        run: |
          set -euo pipefail
          arch=amd64
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/enfein/mieru/releases/latest)"
          asset_url="$(jq -er --arg arch "$arch" '.assets[] | select(.name | test("^mieru_.*_linux_" + $arch + "\\.tar\\.gz$")) | .browser_download_url' <<<"$release_json" | head -n1)"
          curl --fail --silent --show-error --location "$asset_url" -o /tmp/mieru-client.tar.gz
          rm -rf /tmp/mieru-client && mkdir -p /tmp/mieru-client
          tar -xzf /tmp/mieru-client.tar.gz -C /tmp/mieru-client
          client_bin="$(find /tmp/mieru-client -type f -name mieru -perm -u+x | head -n1)"
          test -n "$client_bin"
          sudo install -m 0755 "$client_bin" /usr/local/bin/mieru
          mieru version
      - name: Install real NaiveProxy client
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/klzgrad/naiveproxy/releases/latest)"
          asset_url="$(jq -er '.assets[] | select(.name | test("^naiveproxy-v.*-linux-x64\\.tar\\.xz$")) | .browser_download_url' <<<"$release_json" | head -n1)"
          curl --fail --silent --show-error --location "$asset_url" -o /tmp/naiveproxy.tar.xz
          rm -rf /tmp/naiveproxy && mkdir -p /tmp/naiveproxy
          tar -xJf /tmp/naiveproxy.tar.xz -C /tmp/naiveproxy
          naive_bin="$(find /tmp/naiveproxy -type f -name naive -perm -u+x | head -n1)"
          test -n "$naive_bin"
          sudo install -m 0755 "$naive_bin" /usr/local/bin/naive
          naive --version
      - name: Install real Caddy runtime for unit tests
        run: |
          # The systemd-unit validation step above symlinks /usr/local/bin/caddy to
          # the veil stub so `caddy list-modules` fails. Unit tests probe Caddy
          # capabilities, so install a real Caddy earlier in PATH (mirrors ci.yml).
          # Use sudo + a fresh dir: prior sudo steps may leave root-owned files
          # under /tmp/veil-runtime that break the caddy build-dir cleanup.
          sudo rm -rf /tmp/veil-runtime
          sudo ./bin/veil runtime install --only naiveproxy --bin-dir /tmp/veil-runtime
          echo "/tmp/veil-runtime" >> "$GITHUB_PATH"
          /tmp/veil-runtime/caddy list-modules | grep -Fx http.handlers.forward_proxy
      - run: go test ./... -race -count=1
      # e2e data-path tests need root (mita creates /var/run/mita, protocols bind
      # privileged paths). ci.yml only runs the Required-* data-path tests, not the
      # full legacy suite (legacy TestMieruDataPath / TestRollbackWorkflow are not
      # maintained in CI and are flaky there). Mirror ci.yml exactly.
      - run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags e2e ./test/e2e/... -run '^TestRequiredHysteria2DataPath$' -count=1 -v -timeout=90s
      - run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags e2e ./test/e2e/... -run '^TestRequiredMieruTCPDataPath$' -count=1 -v -timeout=90s
      - run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags e2e ./test/e2e/... -run '^TestRequiredMieruUDPDataPath$' -count=1 -v -timeout=90s
      - run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags e2e ./test/e2e/... -run '^TestRequiredNaiveProxyDataPath$' -count=1 -v -timeout=90s
      - run: bash -n scripts/install.sh scripts/uninstall.sh scripts/package-smoke.sh
      - run: sh -n packaging/scripts/*.sh
      - run: bash scripts/install.sh --help >/dev/null
      - run: bash scripts/uninstall.sh --help >/dev/null
      - run: git diff --check

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.5'
      - name: Build Veil browser-test binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/veil ./cmd/veil
      - name: Install pinned Playwright
        working-directory: test/browser
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Start authenticated Panel
        run: |
          set -euo pipefail
          browser_root="${RUNNER_TEMP}/veil-browser"
          mkdir -p "${browser_root}/state" "${browser_root}/etc" "${browser_root}/apply" "${browser_root}/live"
          export VEIL_STATE_PATH="${browser_root}/state/state.json"
          export VEIL_KEY_PATH="${browser_root}/etc/state.key"
          export VEIL_APPLY_ROOT="${browser_root}/apply"
          export VEIL_LIVE_ROOT="${browser_root}/live"
          ./dist/veil admin set \
            --username browser-admin \
            --password 'Browser-E2E-Password-123!' \
            --role admin \
            --state "${VEIL_STATE_PATH}" \
            --key-path "${VEIL_KEY_PATH}"
          VEIL_API_TOKEN=browser-e2e-token ./dist/veil serve --listen 127.0.0.1:2096 >"${RUNNER_TEMP}/veil-browser.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/veil-browser.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:2096/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/veil-browser.log" >&2
          exit 1
      - name: Browser end-to-end tests
        working-directory: test/browser
        env:
          VEIL_BROWSER_BASE_URL: http://127.0.0.1:2096
          VEIL_BROWSER_USERNAME: browser-admin
          VEIL_BROWSER_PASSWORD: Browser-E2E-Password-123!
        run: npm test
      - name: Stop Panel
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/veil-browser.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/veil-browser.pid")" 2>/dev/null || true
          fi
      - name: Archive browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-diagnostics
          path: |
            test/browser/playwright-report
            test/browser/test-results
            ${{ runner.temp }}/veil-browser.log
          if-no-files-found: ignore

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.5'
      - name: Build package payload
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/veil ./cmd/veil
      - name: Install pinned nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0
      - name: Install and upgrade native packages in clean distributions
        run: bash scripts/package-smoke.sh

  release:
    runs-on: ubuntu-latest
    needs: [quality, browser-e2e, package-smoke]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux/amd64
          - goos: linux
            goarch: arm64
            label: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.5'
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/veil ./cmd/veil
          tar -C dist -czf "dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" veil
      - name: Build native packages (deb/rpm/apk)
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0
          version="${GITHUB_REF_NAME#v}"
          target_goarch="${{ matrix.goarch }}"
          case "${target_goarch}" in
            amd64) pkgarch=amd64 ;;
            arm64) pkgarch=arm64 ;;
            *) pkgarch="${target_goarch}" ;;
          esac
          export VEIL_VERSION="${version}"
          export VEIL_ARCH="${pkgarch}"
          export VEIL_MAINTAINER="Veil Maintainers <veil@users.noreply.github.com>"
          for pkger in deb rpm apk; do
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager "${pkger}" --target dist/
          done
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Upload installer artifact
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-installer
          path: scripts/install.sh
          if-no-files-found: error

  docker-publish:
    runs-on: ubuntu-latest
    needs: [quality, browser-e2e, package-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Verify Docker image version before publishing
        run: |
          docker build --pull --build-arg "VERSION=${GITHUB_REF_NAME}" --tag veil:release-check .
          docker run --rm veil:release-check version | tee /tmp/veil-version.txt
          grep -F "${GITHUB_REF_NAME}" /tmp/veil-version.txt
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images="${images} ${tag}"
          done
          cosign sign --yes ${images}

  publish:
    runs-on: ubuntu-latest
    # Legacy ordering sentinel retained for self-audit compatibility: needs: [quality, release, docker-publish]
    needs: [quality, browser-e2e, package-smoke, release, docker-publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.5'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: veil*
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum veil_linux_amd64.tar.gz veil_linux_arm64.tar.gz \
            *.deb *.rpm *.apk install.sh > checksums.txt
          cat checksums.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/veil.sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums and SBOM (keyless)
        run: |
          set -euo pipefail
          for f in dist/checksums.txt dist/veil.sbom.spdx.json; do
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "${f}"
          done
      - name: Attest release artifacts (SLSA provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/checksums.txt
            dist/veil.sbom.spdx.json
            dist/veil_linux_*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Veil ${GITHUB_REF_NAME}" \
            --notes "Automated Veil release with Linux amd64/arm64 archives, native deb/rpm/apk packages, checksums, SBOM, keyless cosign signatures, browser E2E, and clean-distribution package upgrade validation."
