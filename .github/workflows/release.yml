name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  # Least privilege floor — publishing jobs escalate explicitly (#1146). A
  # gate job that only reads the tree must never run with contents:write,
  # packages:write, attestations:write and an OIDC token.
  contents: read

jobs:
  # Source checks run once in CI; release only accepts their exact main commit.
  verified-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Verify successful main CI and CodeQL for the tagged commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release-ci-gate.py --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}"

  # package-smoke runs AFTER the release job and installs the exact nfpm
  # artifacts that job built — green smoke means the packages about to be
  # published actually install/upgrade/remove (issue #396).
  package-smoke:
    needs: [verified-ci, release]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "go_version=${CI_GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - name: Download frontend from the verified CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.verified-ci.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Restore source- and content-verified frontend dist
        env:
          CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
        run: bash scripts/ci/prepare-frontend-dist.sh
      - name: Install pinned nfpm
        run: |
          . scripts/ci/versions.sh
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${CI_NFPM_VERSION}"
      - name: Download the shipped native packages built by the release job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: veil-linux-${{ matrix.arch }}
          path: dist-shipped
      - name: Install and upgrade native packages in clean distributions
        env:
          VEIL_GOARCH: ${{ matrix.arch }}
          VEIL_ARCH: ${{ matrix.arch }}
          # The NEW packages are the shipped artifacts; the locally built
          # binary only fills the fake-version OLD upgrade-source package.
          VEIL_SMOKE_PREBUILT_DIR: dist-shipped
          VEIL_SMOKE_EXPECTED_BINARY_VERSION: ${{ github.ref_name }}
        run: bash scripts/package-smoke.sh

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [verified-ci]
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux/amd64
          - goos: linux
            goarch: arm64
            label: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          echo "go_version=${CI_GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      - name: Download frontend from the verified CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-frontend-dist-${{ github.sha }}
          path: .artifacts/ci/frontend-dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.verified-ci.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Restore source- and content-verified frontend dist
        env:
          CI_FRONTEND_DIST_ARTIFACT_DIR: .artifacts/ci/frontend-dist
        run: bash scripts/ci/prepare-frontend-dist.sh
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" -o dist/veil ./cmd/veil
          tar -C dist -czf "dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" veil
      - name: Build native packages (deb/rpm/apk)
        run: |
          set -euo pipefail
          . scripts/ci/versions.sh
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${CI_NFPM_VERSION}"
          version="${GITHUB_REF_NAME#v}"
          target_goarch="${{ matrix.goarch }}"
          case "${target_goarch}" in
            amd64) pkgarch=amd64 ;;
            arm64) pkgarch=arm64 ;;
            *) pkgarch="${target_goarch}" ;;
          esac
          export VEIL_VERSION="${version}"
          export VEIL_ARCH="${pkgarch}"
          export VEIL_MAINTAINER="Veil Maintainers <veil@users.noreply.github.com>"
          for pkger in deb rpm apk; do
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager "${pkger}" --target dist/
          done
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/veil_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Upload installer artifact
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-installer
          path: |
            scripts/install.sh
            scripts/install-privileged.sh
          if-no-files-found: error

  docker-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [verified-ci, package-smoke]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      # The release image must build with the same pinned Go transport as the
      # PR image-build path (scripts/ci/image-build.sh) — drifting build args
      # mean the shipped artifact was never the tested one (issue #681).
      - id: versions
        run: |
          source scripts/ci/versions.sh
          { echo "go_godebug=${CI_GO_GODEBUG}"; echo "go_goproxy=${CI_GO_GOPROXY}"; } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU (arm64 image build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 'latest' is earned only by an exact stable semver tag vMAJOR.MINOR.PATCH
      # — prereleases (v1.2.3-rc.1) and non-semver tags must not move the
      # floating tag (#1148). GHA expressions have no regex, so the test runs
      # in a step and feeds the metadata action's per-tag `enable=` switch.
      - name: Detect stable semver release tag
        id: stable
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.stable.outputs.stable }}
      - name: Build and push multi-arch Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GO_GODEBUG=${{ steps.versions.outputs.go_godebug }}
            GO_GOPROXY=${{ steps.versions.outputs.go_goproxy }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
      - name: Verify the pushed image is the tagged multi-arch build
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          # The gate must validate the exact artifact that was pushed, not a
          # separately rebuilt local image — and BOTH architectures: a manifest
          # entry alone does not prove the arm64 blob executes (QEMU is already
          # set up above for the build), and `veil version` only proves the
          # ldflags stamp. Each arch must also serve the embedded panel SPA —
          # the same probe scripts/ci/image-build.sh runs on the PR image
          # (issues #441, #681).
          docker buildx imagetools inspect "${image}"
          docker buildx imagetools inspect "${image}" | grep -F "linux/amd64"
          docker buildx imagetools inspect "${image}" | grep -F "linux/arm64"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform##*/}"
            docker pull --platform "${platform}" "${image}"
            docker run --rm --platform "${platform}" "${image}" version \
              | tee "/tmp/veil-version-${arch}.txt"
            grep -F "${GITHUB_REF_NAME}" "/tmp/veil-version-${arch}.txt"
            bash scripts/ci/image-spa-probe.sh "${image}" "${platform}"
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t images <<< "${TAGS}"
          cosign sign --yes "${images[@]}"

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [verified-ci, package-smoke, release, docker-publish]
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact tagged source
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${tag_commit}" = "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - id: versions
        run: |
          source scripts/ci/versions.sh
          {
            echo "go_version=${CI_GO_VERSION}"
            echo "node_version=${CI_NODE_VERSION}"
            echo "pnpm_version=${CI_PNPM_VERSION}"
            echo "syft_version=${CI_SYFT_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
      # Provenance records the Node/pnpm versions that built the release — they
      # must be the pinned toolchain, not the runner's ambient one (#423).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.versions.outputs.pnpm_version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
      # Scan the clean source tree BEFORE dist/ is populated with release
      # artifacts — otherwise the signed SPDX lists downloaded package blobs as
      # dependencies (#445). The pin keeps parity with `make sbom` (#424).
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          syft-version: ${{ steps.versions.outputs.syft_version }}
          output-file: ${{ runner.temp }}/veil.sbom.spdx.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: veil*
          merge-multiple: true
      - name: Stage SBOM into dist
        run: mv "${{ runner.temp }}/veil.sbom.spdx.json" dist/veil.sbom.spdx.json
      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum veil_linux_amd64.tar.gz veil_linux_arm64.tar.gz \
            *.deb *.rpm *.apk install.sh install-privileged.sh > checksums.txt
          cat checksums.txt
      - name: Generate SLSA v1 release provenance
        run: |
          set -euo pipefail
          go_version="$(go version | awk '{print $3}')"
          node_version="$(node --version | sed 's/^v//')"
          pnpm_version="$(pnpm --version)"
          python3 scripts/release-provenance.py \
            --dist dist \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --source-commit "${GITHUB_SHA}" \
            --go-version "${go_version}" \
            --node-version "${node_version}" \
            --pnpm-version "${pnpm_version}" \
            --dependency-manifest go.sum \
            --dependency-manifest web/pnpm-lock.yaml \
            --output dist/veil.provenance.json
      - name: Extract exact changelog release notes
        run: |
          python3 scripts/release-notes.py \
            --changelog CHANGELOG.md \
            --tag "${GITHUB_REF_NAME}" \
            --output dist/release-notes.md
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums and SBOM (keyless)
        run: |
          set -euo pipefail
          for f in dist/checksums.txt dist/veil.sbom.spdx.json dist/veil.provenance.json dist/install.sh dist/install-privileged.sh; do
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "${f}"
          done
      - name: Attest release artifacts (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/veil.sbom.spdx.json
            dist/veil.provenance.json
            dist/install.sh
            dist/install-privileged.sh
            dist/veil_linux_*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Veil ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
