# Veil docker-compose example
# docker compose up -d

services:
  veil:
    image: ghcr.io/mikkelchokolate/veil:dev
    build: .
    container_name: veil
    restart: unless-stopped
    network_mode: host
    volumes:
      - veil-state:/var/lib/veil
      - veil-etc:/etc/veil
    environment:
      # REQUIRED: an explicit API token. Docker's host networking exposes the
      # panel to the host's loopback, where dev-anonymous would otherwise be
      # a valid auth path on a never-configured instance; requiring a token
      # keeps that escape hatch armed only where no token exists (#1100).
      # Compose aborts `up` when the variable is unset rather than starting
      # an anonymously-administerable panel.
      - VEIL_API_TOKEN=${VEIL_API_TOKEN:?set VEIL_API_TOKEN in the environment or a .env file}
      - VEIL_WEB_BASE_PATH=${VEIL_WEB_BASE_PATH:-}
      - VEIL_AUTO_TLS=${VEIL_AUTO_TLS:-}
      - VEIL_AUTO_TLS_DIR=${VEIL_AUTO_TLS_DIR:-}
    command: serve
    healthcheck:
      test: ["CMD", "veil", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  veil-state:
  veil-etc:
