# ci/vm/packages.lock — apt package lists per CI image target.
# Consumed by ci/vm/Containerfile. Keep sorted; justify additions in
# docs/development/ci.md (image contents section).
# Format: one package per line, "#" comments allowed, blank lines ignored.

[target:base]
bash
ca-certificates
curl
gcc
git
jq
libc6-dev
# i18n catalog parity check (web/scripts/i18n_check.py, stdlib only)
python3-minimal
make
# staticcheck cache / analysis
shellcheck
sudo
tar
xz-utils

[target:browser]
# Chromium runtime dependencies for headless Playwright (see
# https://playwright.dev/docs/ci#docker). Fonts limited to what the SPA
# actually renders.
fonts-liberation
libasound2t64
libatk-bridge2.0-0
libatk1.0-0
libatspi2.0-0
libcairo2
libcups2
libdbus-1-3
libdrm2
libgbm1
libglib2.0-0
libnspr4
libnss3
libpango-1.0-0
libx11-6
libxcb1
libxcomposite1
libxdamage1
libxext6
libxfixes3
libxkbcommon0
libxrandr2
xdg-utils

[target:system]
dbus
dpkg-dev
fakeroot
iproute2
iptables
kmod
nftables
rpm
systemd
systemd-container
ufw
