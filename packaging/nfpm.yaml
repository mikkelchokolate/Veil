# nfpm configuration for Veil native Linux packages (.deb, .rpm, .apk).
#
# Build locally with:
#   VEIL_VERSION=1.2.3 GOOS=linux GOARCH=amd64 make package
# or directly:
#   nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
#
# The veil binary must already exist at dist/veil for the target arch before
# packaging. The release workflow builds it per-arch and then invokes nfpm.

name: veil
arch: ${VEIL_ARCH}
platform: linux
version: ${VEIL_VERSION}
section: net
priority: optional
maintainer: ${VEIL_MAINTAINER}
description: |
  Veil management panel for NaiveProxy, Hysteria2, olcRTC, and Mieru.
  Installs the Panel first; proxy Inbounds are added later from the Panel.
vendor: Veil
homepage: https://github.com/mikkelchokolate/Veil
license: GPL-3.0-or-later

# Packages ship the Panel binary and managed systemd units only. Protocol
# runtimes and configuration are provisioned later from the Panel, matching the
# install-script behavior.
contents:
  - src: dist/veil
    dst: /usr/local/bin/veil
    file_info:
      mode: 0755
  # Vendor systemd units and the QUIC sysctl drop-in are package-owned files,
  # NOT conffiles: `dpkg -r`/`rpm -e`/`apk del` must remove them (type: config
  # would leave them behind until purge — issue #475). Operators customize via
  # systemd drop-ins, never by editing these vendor files.
  - src: packaging/systemd/veil.service
    dst: /lib/systemd/system/veil.service
  - src: packaging/systemd/veil-helper.service
    dst: /lib/systemd/system/veil-helper.service
  - src: packaging/systemd/veil-helper.socket
    dst: /lib/systemd/system/veil-helper.socket
  - src: packaging/systemd/veil-backup.service
    dst: /lib/systemd/system/veil-backup.service
  - src: packaging/systemd/veil-backup.timer
    dst: /lib/systemd/system/veil-backup.timer
  - src: packaging/systemd/veil-caddy.service
    dst: /lib/systemd/system/veil-caddy.service
  - src: packaging/systemd/veil-hysteria2@.service
    dst: /lib/systemd/system/veil-hysteria2@.service
  - src: packaging/systemd/veil-mieru.service
    dst: /lib/systemd/system/veil-mieru.service
  - src: packaging/systemd/veil-olcrtc@.service
    dst: /lib/systemd/system/veil-olcrtc@.service
  - src: packaging/systemd/veil-warp.service
    dst: /lib/systemd/system/veil-warp.service
  - src: packaging/sysctl/99-veil-quic.conf
    dst: /etc/sysctl.d/99-veil-quic.conf
  - dst: /etc/veil
    type: dir
    file_info:
      # 0751 root:veil matches postinstall.sh and internal/hostaccess: the
      # protocol units (User=veil-proxy) traverse /etc/veil via the other
      # execute bit to reach the veil-proxy-grouped generated/tls/panel dirs.
      mode: 0751

# Alpine invokes a distinct hook for package upgrades. Reuse the hardened
# post-install migration and ownership repair logic so APK upgrades receive the
# same fail-closed handling as fresh installs and DEB/RPM upgrades.
apk:
  scripts:
    postupgrade: packaging/scripts/postinstall.sh

overrides:
  deb:
    depends:
      - ca-certificates
    recommends:
      # Veil manages the host firewall through ufw on direct/caddy installs.
      # Recommends, not Depends: dpkg -i must still work on hosts that manage
      # the firewall differently; the installer preflights ufw at runtime.
      - ufw
  rpm:
    depends:
      - ca-certificates
      # postinstall.sh creates the veil/veil-proxy service accounts with
      # groupadd/useradd, which shadow-utils provides.
      - shadow-utils
  apk:
    depends:
      - ca-certificates

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
